<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order of the Day</title>
  <meta name="description" content="Set tomorrow's priorities each night, then book what you did against that day's list.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f151b" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Order">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div>
        <h1>Order of the Day</h1>
        <div class="datebar" id="datebar"></div>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button type="button" role="tab" data-tab="tonight" aria-selected="false">Tonight</button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
      <button type="button" role="tab" data-tab="lists" aria-selected="false">Lists</button>
    </nav>

    <main id="view"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="store.js"></script>
  <script src="app.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
