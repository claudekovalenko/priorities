<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order of the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div>
        <h1>Order of the Day</h1>
        <p class="tagline">Set the list at night. Book what you did against it the next day.</p>
      </div>
      <div class="datebar" id="datebar"></div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button type="button" role="tab" data-tab="tonight" aria-selected="false">Tonight</button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
      <button type="button" role="tab" data-tab="lists" aria-selected="false">Lists</button>
    </nav>

    <main id="view"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
